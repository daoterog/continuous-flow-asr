[project]
name = "flow_asr"
version = "0.1.0"
dependencies = [
    "datasets>=5.0.1",
    "einops>=0.8.2",
    "evaluate>=0.4.6",
    "flow-matching>=1.0.10",
    "ipykernel>=7.3.0",
    "jiwer>=4.0.0",
    "kaldialign>=0.12.0",
    "librosa>=1.0.0",
    "lightning>=2.6.6",
    "matplotlib>=3.11.2",
    "num2words>=0.5.14",
    "omegaconf>=2.3.1",
    "peft>=0.20.0",
    "ruff>=0.16.4",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "submitit>=1.5.4",
    "torch>=2.11.0,<2.13.0",
    "torchcodec>=0.16",
    "torchmetrics>=1.9.0",
    "transformers>=5.16.1",
    "wandb>=0.30.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


[tool.uv.sources]
# Same index for both: torchcodec is ABI-locked to torch and the CUDA major
# version, and PyPI's build will not load. CUDA 13 needs driver >= 580.
torch = { index = "pytorch-cu130" }
torchcodec = { index = "pytorch-cu130" }

# Static metadata so resolving/locking never has to run flash-attn's setup.py.
[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.3"
requires-dist = ["torch", "einops"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored upstream code; not ours to lint or reformat. open_asr_leaderboard is a git
# submodule; src/models/drax is DRAX's flow decoder (CC-BY-NC, Meta / aiOla) and
# src/models/fmlm is the FMLM/DUO reference implementation, both copied in verbatim so
# the licence headers and the upstream diff stay readable.
extend-exclude = ["open_asr_leaderboard", "src/models/drax", "src/models/fmlm"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: undefined names, unused imports and variables
    "I",   # isort: import ordering
    "D",   # pydocstyle: docstrings, Google convention (see below)
    "ANN", # flake8-annotations: type hints on parameters and returns
    "B",   # bugbear: likely bugs (mutable default args, etc.)
    "UP",  # pyupgrade: modern syntax for the target Python version
    "SIM", # simplify: needlessly complex constructs
    "N",   # pep8-naming
    "RUF", # ruff-specific rules (unused noqa, etc.)
]
ignore = [
    # `import torch.nn.functional as F` is the universal torch convention; renaming it
    # would make every model file read unlike every other codebase.
    "N812",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts"]
# `src.constants` sets HF_HOME and puts the leaderboard submodule on sys.path, and
# huggingface resolves its cache at *import* time — so it has to be imported before
# transformers. Its own section keeps it above third-party without anyone hand-sorting,
# and without pushing the import down into a function body.
section-order = [
    "future",
    "standard-library",
    "bootstrap",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
bootstrap = ["src.constants"]
