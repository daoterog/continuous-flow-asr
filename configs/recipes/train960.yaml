# Recipe: the final compact-vocabulary model, fulldata.yaml's stack on all of LibriSpeech.
#
#   python train.py --config configs/recipes/train960.yaml --where snellius --run big
#
# Everything that was screened on train.100 is inherited unchanged — model, sigma 0.4,
# draft-mu, EMA, wd 0.05, the schedule — so this run differs from the screens in the data
# alone. The vocabulary stays compact (V=1,193 on train.100, re-measured here: train.960
# brings tokens train.100 never used), which is what every screen measured.
# train960_full.yaml is the same run over Whisper's full vocabulary.
_base_: fulldata.yaml

recipe: train960

data:
  splits:
    # LibriSpeech's three training sets: train.clean.100, train.clean.360 and
    # train.other.500. The cross product names six pairs; src/data/spec.resolve_role keeps
    # the three that exist on disk.
    train: {configs: [clean, other], splits: [train.100, train.360, train.500]}
    # Clean validation and test, as every screen, so the numbers line up.
    val:   {configs: [clean], splits: [validation]}
    test:  {configs: [clean], splits: [test]}
  # train.960's 1.1 TB of latents cannot all be held in RAM, so ~40% of reads go to GPFS,
  # where a read waits on latency: cold throughput grows with reads in flight until the
  # node's bandwidth caps it. H100 node, 2026-10-19, one job, fresh utterances (cold / warm
  # utt/s): 16x1 46 / 1044 | 32x4 154 / 2767 | 64x2 186 / 1952 | 64x4 218 / 1994 |
  # 128x1 215 / 1342 — flat past ~128 in flight at ~0.84 GB/s. Processes beat threads (a
  # process's page faults partly serialize), but each worker is a whole Python process, so
  # 64 workers x 4 threads rather than 128 x 1. Identical batches either way.
  num_workers: 64
  read_threads: 4
