# Denoiser geometry only, layered over any variant with `--size large`.
# Drax's geometry (580M over Whisper's vocab, 450M over ours). DRAX trained this on
# 15K hours ~ 200M tokens; on train.100 it is ~330 params per token, so expect it
# to memorise rather than generalise until the data scales with it.
#
# mu (model.audio_decoder) is deliberately NOT scaled here: DRAX hold their
# audio-conditioned p_mid at 28M across both model sizes, and the variant configs
# own that field. Only the variants that use mu define it at all.
model:
  denoiser:
    hidden_size: 1280
    cond_dim: 128
    n_heads: 20
    n_blocks: 16
