# Denoiser geometry only, layered over any variant with `--size small`.
# ~30 params per training token on train.100 (1.35M tokens); the first size with
# real capacity that the 100-hour subset can plausibly support.
#
# mu (model.audio_decoder) is deliberately NOT scaled here: DRAX hold their
# audio-conditioned p_mid at 28M across both model sizes, and the variant configs
# own that field. Only the variants that use mu define it at all.
model:
  denoiser:
    hidden_size: 512
    cond_dim: 128
    n_heads: 8
    n_blocks: 8
