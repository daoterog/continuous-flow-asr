# Defaults shared by every run. The variant files next to this one set `_base_: base.yaml`
# and override only what differs. Anything here is also settable on the command line:
#   python train.py --config configs/linear.yaml train.num_epochs=10 data.batch_size=16

seed: 0

# Which variant this is, uploaded as a hyperparameter so runs group and filter by it.
# Left null it is filled in from the config file's stem.
variant: null

# Which entry of configs/sizes/ shaped the denoiser, filled in by `--size`. A hyperparameter
# like `variant`, so a size sweep is filterable in wandb; null means the geometry came from
# model.denoiser below rather than from a size file.
size: null

# The same for mu_psi, filled in by `--mu` from configs/mu/. Independent of `size`: DRAX
# hold mu fixed across both their model sizes, so the two are separate axes to ablate.
mu_size: null

data:
  # `local` -> ./data, `snellius` -> /scratch-shared/cont-flow-asr/data. data_root wins.
  env: local
  data_root: null
  # The checkpoint the features were precomputed with; names the cache directory.
  model: openai/whisper-large-v3

  # Wide enough for the whole corpus: measured over clean/{train.100,validation,test},
  # tokens per utterance run mean 67, p99 113, max 215 — and train.100 is the longest
  # split (mean 71.5), so a short canvas costs training data first. 96 dropped 8.4% of all
  # utterances; 128 keeps 99.75%; 224 keeps everything.
  #
  # Anything over canvas_len is filtered out, so this also silently decides how much of
  # test is scored. Padding is a real target the model learns to emit, but it is 70% of
  # the field here, and the binned metrics count pad positions in their denominator — so
  # P_e and the binned loss are NOT comparable across different canvas_len values.
  canvas_len: 224
  # mean-pool the 1500 Whisper frames: stride 4 makes them 80 ms and cuts the
  # cross-attention keys 4x.
  audio_stride: 4
  batch_size: 32
  # null means one epoch is one pass over the training subset. Set it to make an epoch a
  # fixed number of steps instead, sampling with replacement — worth it on small subsets,
  # where the per-epoch fixed cost otherwise dominates.
  steps_per_epoch: null
  compact_vocab: true
  # 16 on an A100 node with 16 cores: measured 849 -> 952 -> 1058 utts/s at 4 -> 8 -> 16
  # workers. Loading, not the step, is what bounds throughput here, so this is the single
  # largest lever. A 6-core laptop wants 4; match it to the cores you actually have.
  num_workers: 16

  # One role = configs x splits, the same cross product the precompute scripts take.
  # Overridable as --train-configs / --train-splits / --val-configs / ... on the CLI.
  splits:
    train: {configs: [clean], splits: [train.100]}
    val:   {configs: [clean], splits: [validation]}
    test:  {configs: [clean], splits: [test]}

  # Cap per role, applied after the canvas-length filter. null means all of it.
  subset_n:
    train: 2000
    val: null
    test: null

model:
  denoiser:
    hidden_size: 256
    cond_dim: 64
    n_heads: 4
    n_blocks: 4
    dropout: 0.1
    # whisper_dim defaults to the large-v3 encoder width (1280).
  # null drops mu entirely; the audio-conditioned variants fill this in.
  audio_decoder: null

flow:
  # I_t = alpha(t) x0 + beta(t) x1 [+ gamma(t) mu]
  alpha: linear_down          # 1 - t
  beta: linear_up             # t
  gamma: null                 # linear_down, or {type: parabola, c: 0.5}
  stop_grad_mu: true
  # How hard mu's own cross-entropy is trained, NOT how much mu enters the flow (that is
  # gamma). At 1.0 the auxiliary loss dominates the objective and starves the denoiser:
  # measured on 64 memorised utterances, 1.0 gave 41% sampled WER and 0.1 gave 0.00%,
  # with mu itself perfect either way. mu converges easily and does not need the weight.
  mu_loss_weight: 0.1

schedule:
  # Draw t through tau^-1 rather than uniformly. Off, ~65% of every batch lands below the
  # dead zone where x_t carries nothing.
  enabled: true
  sweep_n: 1024                 # utterances in the model-free corruption sweep
  num_bins: 100               # resolution of the measured P_e curve
  # How accurate mu is assumed to be while tau is measured. Only used when flow.gamma is
  # set; refresh_tau replaces the assumption with the model's measured accuracy.
  #
  # 0.0 because tau is built BEFORE training, when mu_nn is at init and its output really
  # does carry nothing. This is not a pessimistic guess — it is the state of the model at
  # the moment the measurement is taken. The corruption sweep agrees: an accuracy-0 mu
  # emits a confident one-hot on a random token, whose gamma(t)~1 spike loses to the noise
  # maximum alpha*sqrt(2 ln V)~3.8, so its P_e curve sits on top of the no-mu path — see
  # scripts/plot_mu_sweep.py, where 0% and "no mu" coincide.
  #
  # The previous default of 1.0 assumed a perfect mu from step one and put the training
  # mass where a perfect mu would have carried the signal. Measured mu accuracy on
  # train.100 is 0.39-0.57, never close to 1.
  mu_accuracy: 0.0
  # Smoothing on mu's measured accuracy before tau is rebuilt from it. The average updates
  # every validation while tau is rebuilt only every refresh_every_n_epochs, so the lag is
  # m/(1-m) epochs whatever the refresh cadence. 0.0 uses the latest reading. Measured over
  # six runs, only ~65% of epochs improved mu's error and the jitter about the trend was as
  # large as the average step; 0.8 cuts that 3.6x for a 0.016 lag, biased toward
  # *under*-stating mu, which is the safe direction. Both the raw and smoothed values are
  # logged as tau/mu_accuracy_measured and tau/mu_accuracy_ema.
  mu_accuracy_momentum: 0.8

  # Which split's mu accuracy rebuilds tau. `train`, because tau decides which t the next
  # epochs are trained on, so measuring it on `val` would let held-out data steer training
  # — and because the training path really is built from mu's output on training audio.
  # The cost is that a memorising mu reports near-perfect accuracy (measured: 1.000 on
  # train against 0.490 on val for --mu small) and tau is then built on a fiction. Watch
  # tau/mu_generalisation_gap; at --mu micro the two agree to 0.036.
  refresh_from: train

  # Re-derive tau from the model's own P_e every N validations, replacing the
  # corruption-sweep prior. 0 disables it. The bins move with it, so histograms are not
  # comparable across a refresh — the underlying t-distribution genuinely changed.
  refresh_every_n_epochs: 0

sampling:
  # Integrate from noise on a fixed slice of val and score the result. This is the only
  # metric that reflects inference — the binned ones score one denoising step from an x_t
  # built out of the target, which at high t largely measures the input.
  enabled: true
  num_steps: 16
  every_n_epochs: 5
  n_utts: 64
  # Feed back a one-hot argmax instead of the softmax. The softmax is closer to what
  # training showed the model, so it is the default.
  hard: false

metrics:
  loss_bins: 10
  perr_bins: 10
  # WER needs a decode per batch, so it is off on train by default.
  wer_bins: {train: 0, val: 10, test: 10}
  # Token error of argmax(x_t) — the interpolant with no model in the loop. Against
  # denoiser_perr it shows what the denoiser adds over its own input, and across variants
  # it shows how much mu actually contributes to the field. One argmax, so it is cheap.
  input_perr_bins: 10

train:
  num_epochs: 50
  # 1e-2 came from the notebook and is far too hot: on the overfit check it sat at
  # loss 1.86 where 1e-3 reached 0.014. The optimum moves with the step count, since
  # OneCycleLR derives its schedule from the total, so re-check it if epochs change a lot.
  denoiser_lr: 1.0e-3
  audio_decoder_lr: 1.0e-3
  # torch.optim.AdamW's own default, which is what the notebook ran under by not passing
  # one. Set 0.0 to turn decay off.
  weight_decay: 0.01
  grad_clip: 1.0
  accelerator: auto
  devices: 1
  precision: null
  fast_dev_run: false
  log_every_n_steps: 50
  # Validation costs a decode per batch when WER is on; on short-epoch runs (an overfit
  # check has a handful of steps per epoch) it is worth checking less often.
  check_val_every_n_epoch: 1
  # Lightning's own .ckpt: a pickle of the whole module, loadable only back into the same
  # class. Off by default because save_components below covers what it was kept for, in a
  # form a student model can read. Turn it on for `trainer.test(ckpt_path="best")`, which
  # needs a real Lightning checkpoint.
  checkpoint: false

  # Write runs/<run_id>/components/: per-model state_dicts, the manifest needed to rebuild
  # them, the vocabulary map, and the optimizer state for resuming a cut-short run. Small
  # enough to keep for every run; see src/checkpoint.py.
  save_components: true

  # Stop as soon as a metric reaches its target — e.g. `sampled/wer` at 0 for an overfit
  # check, where everything after that is wasted compute. null disables it. Only the
  # target stops the run; a plateau does not.
  early_stop_on: null
  early_stop_threshold: 0.0
  early_stop_mode: min

  # TF32 for fp32 matmuls. Measured on a 3060 at batch 32, ms/step:
  #   16-mixed  highest 38.5 | high 43.4      <- under AMP the matmuls are already fp16,
  #   32-true   highest 47.9 | high 43.0         so TF32 only slows the fp32 tail
  # So: leave `highest` with 16-mixed, switch to `high` if you run 32-true. Lightning
  # prints an info line recommending `high` whenever this is `highest`; it is advice for
  # fp32 training and is measurably wrong for this model under AMP.
  matmul_precision: highest

  # Moderate reproducibility: seed_everything(workers=True) fixes init, data order, the
  # t draws and each worker's RNG, so runs line up. Bit-exact GPU reductions would need
  # deterministic=true, which measured ~7-10% slower for no benefit we need.
  deterministic: false
  # Only tunes convolution algorithms, and neither model has a conv layer — inert here.
  benchmark: false

  # One fused CUDA kernel for the whole AdamW update instead of a launch per parameter
  # tensor: +28% throughput, since these models are small enough that launch overhead
  # dominates the update. It unscales gradients inside its own kernel, so it CANNOT be
  # combined with grad_clip — set grad_clip: null to use it. Ignored on CPU.
  fused_optimizer: false

  # torch.compile the two models. The largest single win measured (+64% at batch 64),
  # paid for with a one-off warmup: ~40s at "default", ~6 min at "max-autotune-no-cudagraphs".
  # Worth it for a long run, not for a smoke test.
  compile: false
  compile_mode: default

logging:
  # The wandb team runs belong to. Pinned rather than left to the account default, so a
  # run from another machine or a CI job lands in the same place.
  entity: cont-flow-asr-
  project: continuous-flow-asr
  # null lets wandb generate the run name; the variant is carried in `variant` above.
  name: null
  # Runs of the same variant share a group, so repeats and seeds sit together.
  group: null
  offline: false              # or pass --offline
  save_dir: runs
